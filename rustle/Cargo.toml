[package]
name = "rustle"
version = "0.1.0"
edition = "2021"
description = "Find the signal in your logs."
license = "MIT"
readme = "README.md"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
ctrlc = "3"
glob = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
serde_json = "1"
